# Phase 1 verification workload; replaced by ESP32-C6 devices in Phase 2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-publisher
  labels:
    app: mock-publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-publisher
  template:
    metadata:
      labels:
        app: mock-publisher
    spec:
      containers:
        - name: mock-publisher
          image: ghcr.io/taiki3/ebishrimp-mock-publisher:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: MQTT_HOST
              value: rumqttd
            - name: MQTT_USERNAME
              value: device
            # ブローカー側と同一の Secret から取る (複製をなくすため)
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rumqttd-auth
                  key: DEVICE_PASSWORD
            - name: INTERVAL_SECS
              value: "10"
            - name: STATUS_INTERVAL_SECS
              value: "300"
            - name: RUST_LOG
              value: info
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
