apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingester
  labels:
    app: ingester
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingester
  template:
    metadata:
      labels:
        app: ingester
      annotations:
        # rumqttd-auth をローテーションしたら3つの Deployment すべてで
        # 同時に増やすこと。理由は apps/rumqttd/deployment.yaml のコメント参照
        ebishrimp.io/credential-generation: "1"
    spec:
      containers:
        - name: ingester
          image: ghcr.io/taiki3/ebishrimp-ingester:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: MQTT_HOST
              value: rumqttd
            - name: MQTT_PORT
              value: "1883"
            - name: MQTT_USERNAME
              value: ingester
            # MQTT のパスワードはブローカー側と同一の Secret から取る。
            # 以前は ingester-env に複製していたが、片方だけ更新すると
            # 認証が壊れるため単一の出所にまとめた。
            # (ingester-env に残っている MQTT_PASSWORD キーは未使用)
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rumqttd-auth
                  key: INGESTER_PASSWORD
            - name: CLICKHOUSE_URL
              value: http://clickhouse-iot:8123
            - name: CLICKHOUSE_USER
              value: ingester
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ingester-env
                  key: CLICKHOUSE_PASSWORD
            - name: BATCH_MAX_SECS
              value: "60"
            - name: BATCH_MAX_ROWS
              value: "5000"
            - name: RUST_LOG
              value: info
          ports:
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 256Mi
