apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: iot
spec:
  defaults:
    templates:
      podTemplate: clickhouse
      dataVolumeClaimTemplate: data
      serviceTemplate: internal
  configuration:
    files:
      # ClickHouse 内蔵のシステムログはデフォルト全部有効。室内IoT規模では
      # 実データ (6 MiB) に対し trace_log が 15.8 GiB まで膨れ、metric_log
      # (超横長テーブル) のマージが 4Gi limit を超えて失敗→無限リトライし、
      # CPU 2コアを常時食った上に ingester の insert まで道連れにした。
      # メトリクスは Prometheus 側で見ているのでプロファイリング系は落とす。
      config.d/system-logs.xml: |
        <clickhouse>
          <trace_log remove="1"/>
          <metric_log remove="1"/>
          <asynchronous_metric_log remove="1"/>
          <latency_log remove="1"/>
          <processors_profile_log remove="1"/>
          <!-- 障害調査に要るものは残す。
               保持期間はここでは触らない: Altinity operator が query_log /
               part_log に <engine>...TTL event_date + interval 30 day</engine>
               を自動生成しており、<ttl> を併記すると ClickHouse が
               "If 'engine' is specified for system table, TTL parameters should
               be specified directly inside 'engine'" (Code: 36) で起動不能になる。
               重量級の trace_log / metric_log を落とした後は残りは数十MiB規模
               なので、operator 既定の30日で十分。 -->
          <text_log>
            <!-- 既定の trace だと Debug が 5分で3万行入る -->
            <level>information</level>
          </text_log>
        </clickhouse>
      # ディスク枯渇のガードレール。PVC の 50Gi は local-path provisioner が
      # 容量を強制しない (単なる hostPath バインド) ため宣言だけで効いていない。
      # 実効の歯止めはこれ: 空きが閾値を割ると ClickHouse 側が確保を拒否し、
      # insert/merge が失敗する代わりに SSD を最後まで食い潰さない。
      # ingester は3回リトライ後に行を捨てる (spec の「最大1分欠損は許容」の範囲)。
      config.d/storage-guardrail.xml: |
        <clickhouse>
          <storage_configuration>
            <disks>
              <default>
                <!-- 100 GiB を切ったら ClickHouse は書き込みをやめる -->
                <keep_free_space_bytes>107374182400</keep_free_space_bytes>
              </default>
            </disks>
          </storage_configuration>
        </clickhouse>
      # 自前の Prometheus エンドポイント。これが無いと ClickHouse の
      # ディスク使用量が監視から見えず、「ディスクが減っている」ことは
      # 分かっても「犯人が ClickHouse か」が判別できない。
      config.d/prometheus.xml: |
        <clickhouse>
          <prometheus>
            <endpoint>/metrics</endpoint>
            <port>9363</port>
            <metrics>true</metrics>
            <events>true</events>
            <asynchronous_metrics>true</asynchronous_metrics>
          </prometheus>
        </clickhouse>
    clusters:
      - name: main
        layout:
          shardsCount: 1
          replicasCount: 1
    users:
      admin/k8s_secret_password: iot/clickhouse-credentials/admin-password
      admin/networks/ip: "::/0"
      admin/access_management: "1"
      ingester/k8s_secret_password: iot/clickhouse-credentials/ingester-password
      ingester/networks/ip: "::/0"
      dashboard/k8s_secret_password: iot/clickhouse-credentials/dashboard-password
      dashboard/networks/ip: "::/0"
      dashboard/profile: readonly
    profiles:
      readonly/readonly: "2"
  templates:
    serviceTemplates:
      - name: internal
        spec:
          type: ClusterIP
          ports:
            - name: http
              port: 8123
            - name: tcp
              port: 9000
            - name: metrics
              port: 9363
    podTemplates:
      - name: clickhouse
        spec:
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:25.3
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  memory: 4Gi
    volumeClaimTemplates:
      - name: data
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: local-path
          resources:
            requests:
              storage: 50Gi
