# Applies the (idempotent) DDL once ClickHouse is up. To re-run after editing
# the schema: kubectl -n iot delete job clickhouse-schema && flux reconcile ks apps
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-schema
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: apply-schema
          image: clickhouse/clickhouse-server:25.3
          command:
            - bash
            - -ec
            - |
              ch() { clickhouse-client --host "$CH_HOST" --user admin --password "$ADMIN_PASSWORD" "$@"; }
              until ch --query "SELECT 1" >/dev/null 2>&1; do
                echo "waiting for clickhouse..."; sleep 5
              done
              ch --multiquery --queries-file /schema/01_schema.sql
              echo "schema applied"

              # MV の内部テーブルは '.inner_id.<uuid>' で UUID が環境ごとに違うため
              # SQL に静的に書けない。MV 名への ALTER も
              # "Engine MaterializedView doesn't support TTL clause" で拒否される。
              # よって UUID を解決して内部テーブルへ直接当てる (MODIFY TTL は冪等)。
              INNER=$(ch --query "SELECT concat('.inner_id.', toString(uuid)) FROM system.tables WHERE database='default' AND name='sensor_1m'")
              if [ -n "$INNER" ]; then
                ch --query "ALTER TABLE default.\`$INNER\` MODIFY TTL ts_min + INTERVAL 1 YEAR DELETE"
                echo "sensor_1m inner TTL applied: $INNER"
              fi
          env:
            - name: CH_HOST
              value: clickhouse-iot
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: admin-password
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
      volumes:
        - name: schema
          configMap:
            name: clickhouse-schema
