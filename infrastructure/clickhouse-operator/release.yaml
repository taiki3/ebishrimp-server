apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse-operator
  namespace: clickhouse-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: altinity-clickhouse-operator
      sourceRef:
        kind: HelmRepository
        name: altinity
      version: "*"
  values:
    operator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
