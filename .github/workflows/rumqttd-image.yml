name: rumqttd-image
on:
  workflow_dispatch:
    inputs:
      rumqttd_tag:
        description: "bytebeamio/rumqtt tag to build"
        default: "rumqttd-0.20.0"
        required: true
  push:
    branches: [main]
    paths: ["docker/rumqttd/**"]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: |
          T="${{ github.event.inputs.rumqttd_tag }}"
          T="${T:-rumqttd-0.20.0}"
          echo "version=${T#rumqttd-}" >> "$GITHUB_OUTPUT"
          echo "tag=$T" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: docker/rumqttd
          push: true
          build-args: RUMQTTD_TAG=${{ steps.tag.outputs.tag }}
          tags: ghcr.io/${{ github.repository_owner }}/ebishrimp-rumqttd:${{ steps.tag.outputs.version }}
