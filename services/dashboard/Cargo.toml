[package]
name = "dashboard"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The spec mandates tokio-rs/topcoat. It is very early stage; pin the exact
# version and only upgrade deliberately (Cargo.lock is committed).
topcoat = { version = "=0.3.1", default-features = false, features = ["router"] }
tokio = { version = "1", features = ["full"] }
clickhouse = { version = "0.15", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["macros", "formatting"] }
form_urlencoded = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
