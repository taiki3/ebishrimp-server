[workspace]
resolver = "2"
members = [
    "services/ingester",
    "services/mock-publisher",
    "services/dashboard",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
rumqttc = "0.25"
clickhouse = { version = "0.15", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "formatting", "macros", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
anyhow = "1"
rand = "0.9"

[profile.release]
lto = "thin"
strip = true
