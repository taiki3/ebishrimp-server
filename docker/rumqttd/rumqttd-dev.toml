# rumqttd config for local docker-compose development.
# The k8s version (with different credentials) lives in a SOPS-encrypted
# Secret under apps/rumqttd/.
id = 0

[router]
id = 0
max_connections = 10010
max_outgoing_packet_count = 200
max_segment_size = 104857600
max_segment_count = 10

[v4.1]
name = "v4-1"
listen = "0.0.0.0:1883"
next_connection_delay_ms = 1
    [v4.1.connections]
    connection_timeout_ms = 60000
    max_payload_size = 20480
    max_inflight_count = 500
    dynamic_filters = true
        [v4.1.connections.auth]
        ingester = "ingesterpass"
        device = "devicepass"

[console]
listen = "0.0.0.0:3030"

[prometheus]
listen = "0.0.0.0:9042"
interval = 1
